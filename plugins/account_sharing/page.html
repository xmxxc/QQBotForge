<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>账户共享</title>
<style>body{font:16px system-ui;max-width:1100px;margin:24px auto;padding:16px;color:#263347}input,button,select,textarea{padding:9px;margin:4px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}#status{white-space:pre-wrap}label{display:inline-block}</style>
<h1>账户共享管理</h1><p>账户及操作按 Bot 隔离。沿用框架现有持久化、消息及日志记录机制；账密回复可能被记录。请妥善管理后台与日志访问权限。</p>
<label>Bot AppID <input id="bot" autocomplete="off"></label><button id="refresh">加载账户</button><p id="status" role="status"></p>
<form id="account"><input id="id" type="hidden"><label>名称<input id="name" required></label><label>账号<input id="login" required autocomplete="off"></label><label>密码<input id="password" type="password" autocomplete="new-password" required></label><label>说明<input id="description"></label><label>地址<input id="url"></label><label><input id="enabled" type="checkbox" checked>启用</label><button>保存账户</button><button type="button" id="reset">新增</button></form>
<table><thead><tr><th>标识</th><th>名称</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
<h2>群准入与成员授权</h2><p>请先启用“黑白名单授权”模块。已识别成员仅用于选人，不代表完整名册。绑定不等于授权。</p>
<label>群原生 ID<input id="group"></label><label>成员原生 OpenID<input id="member" list="known-members"></label><datalist id="known-members"></datalist>
<label>身份类型<select id="identity-type"><option value="group_member_openid">群原生成员 OpenID</option></select></label>
<label><input id="confirmed" type="checkbox">我已核对成员当前在群</label><label><input id="invoke" type="checkbox" checked>授予调用资格</label>
<label>账户资源（多选）<select multiple id="resources"></select></label><label>拒绝范围<select id="deny-scope"><option value="member">指定成员</option><option value="group">整个群</option></select></label>
<div id="access-actions"></div><button id="load-access">刷新已识别成员与授权状态</button><pre id="access-results"></pre>
<h2>身份绑定与处理结果</h2><p>群原生成员身份与私聊身份分别保存。请先核对两侧确为同一人；公开申请编号不能代替身份核验，绑定不会授予资格。</p>
<label>核对依据<input id="binding-evidence" placeholder="记录核对两侧身份的方法，不填写账密"></label><label><input type="checkbox" id="binding-confirmed">已核对两侧身份关联</label><button id="load-bindings">刷新待绑定申请</button><div id="binding-requests"></div>
<button id="load-operations">刷新操作与发送结果</button><pre id="operation-results"></pre>
<script>
const $=id=>document.getElementById(id);let records=[];
async function api(method,path='',data){let r=await fetch('/api/ext/account-sharing/'+path+'?bot='+encodeURIComponent($('bot').value),{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let v=await r.json();if(!r.ok)throw Error(v.error||'操作失败');return v.data;}
function status(v){$('status').textContent=v;}
function reset(){$('account').reset();$('id').value='';}
async function refresh(){try{records=await api('GET','accounts');$('rows').replaceChildren();$('resources').replaceChildren();for(const a of records){let option=document.createElement('option');option.value=a.id;option.textContent=a.name+' ('+a.id+')';$('resources').append(option);}for(const a of records){let row=document.createElement('tr');for(const v of [a.id,a.name,a.enabled?'启用':'停用']){let c=document.createElement('td');c.textContent=v;row.append(c);}let actions=document.createElement('td');for(const [label,fn] of [['编辑',()=>{for(const k of ['id','name','login','password','description','url'])$(k).value=a[k];$('enabled').checked=a.enabled;}],['删除',async()=>{if(confirm('删除此账户及查询入口？')){await api('DELETE','accounts/'+a.id);reset();await refresh();}}]]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>Promise.resolve(fn()).catch(e=>status(e.message));actions.append(b);}row.append(actions);$('rows').append(row);}status('已加载 '+records.length+' 条账户');}catch(e){status(e.message);}}
$('refresh').onclick=refresh;$('reset').onclick=reset;$('account').onsubmit=async e=>{e.preventDefault();try{let data={};for(const k of ['name','login','password','description','url'])data[k]=$(k).value;data.enabled=$('enabled').checked;let id=$('id').value;await api(id?'PATCH':'POST','accounts'+(id?'/'+id:''),data);reset();await refresh();}catch(e){status(e.message);}};
async function loadAccess(){try{let data=await api('GET','access');$('access-results').textContent=JSON.stringify(data,null,2);$('known-members').replaceChildren();for(const m of Object.values(data.members)){if(m.group!==$('group').value)continue;let o=document.createElement('option');o.value=m.member;o.label=m.name||m.member;$('known-members').append(o);}}catch(e){status(e.message);}}
$('load-access').onclick=loadAccess;
for(const [label,operation,enabled] of [['允许该群','whitelist',true],['移出白名单','whitelist',false],['授权','grant'],['撤权','revoke'],['拉黑','deny'],['解除拉黑','allow'],['解释','explain']]){let b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{let data={operation,group:$('group').value,member:$('member').value};if(['deny','allow'].includes(operation))data.scope=$('deny-scope').value;if(operation==='whitelist')data.enabled=enabled;if(operation==='grant'){data.identity_type=$('identity-type').value;data.confirmed=$('confirmed').checked;data.invoke=$('invoke').checked;data.resources=Array.from($('resources').selectedOptions).map(o=>o.value);}if(operation==='explain')data.resource=$('resources').value;let result=await api('POST','access',data);$('access-results').textContent=JSON.stringify(result,null,2);status('授权操作已保存；授权不代表绑定或发送成功');}catch(e){status(e.message);}};$('access-actions').append(b);}
$('load-bindings').onclick=async()=>{try{let data=await api('GET','bindings');$('binding-requests').replaceChildren();for(const r of data.requests){let row=document.createElement('p');let text=document.createElement('span');text.textContent=[r.id,r.group,r.member,'私聊 '+r.private_id,r.status].join(' | ');row.append(text);if(r.status==='pending'){let b=document.createElement('button');b.textContent='确认绑定';b.onclick=async()=>{try{await api('POST','bindings',{operation:'confirm',request:r.id,confirmed:$('binding-confirmed').checked,evidence:$('binding-evidence').value});status('绑定已确认；查询仍须当前授权和成员状态有效');$('load-bindings').click();}catch(e){status(e.message);}};row.append(b);}$('binding-requests').append(row);}}catch(e){status(e.message);}};
$('load-operations').onclick=async()=>{try{$('operation-results').textContent=JSON.stringify(await api('GET','operations'),null,2);}catch(e){status(e.message);}};
</script></html>
