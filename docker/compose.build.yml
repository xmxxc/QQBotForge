services:
  qqbotforge:
    build:
      context: ..
      dockerfile: .ci/Dockerfile
    image: qqbotforge:local
    container_name: qqbotforge
    restart: unless-stopped
    ports:
      - "5200:5200"
    volumes:
      - ../config:/app/config
      - ../plugins:/app/plugins
      - ../modules:/app/modules
      - ../data:/app/data
    environment:
      TZ: Asia/Shanghai
    tty: true
    stdin_open: true
